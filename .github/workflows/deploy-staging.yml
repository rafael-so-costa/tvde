name: Deploy FrotaPro Staging

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frotapro-staging
  cancel-in-progress: true

jobs:
  incremental:
    name: Deploy incremental
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Detectar alteracoes
        id: changes
        shell: bash
        run: |
          set -euo pipefail

          BEFORE="${{ github.event.before }}"
          AFTER="${{ github.sha }}"

          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            BEFORE="$(git rev-parse "${AFTER}^" 2>/dev/null || true)"
          fi

          if [ -n "$BEFORE" ]; then
            git diff --name-status "$BEFORE" "$AFTER" > changed-files.txt
          else
            git show --pretty="" --name-status "$AFTER" > changed-files.txt
          fi

          echo "Alteracoes detectadas:"
          cat changed-files.txt || true

          FRONTEND=false
          FULL_REQUIRED=false
          MIGRATIONS=false
          DEPLOY=false

          while IFS=$'\t' read -r STATUS PATH1 PATH2; do
            [ -n "${STATUS:-}" ] || continue

            PATH="$PATH1"

            case "$STATUS" in
              R*|C*) PATH="$PATH2" ;;
            esac

            case "$PATH" in
              composer.json|composer.lock)
                FULL_REQUIRED=true
                ;;
            esac

            case "$PATH" in
              resources/js/*|resources/css/*|resources/views/*|package.json|package-lock.json|vite.config.*)
                FRONTEND=true
                ;;
            esac

            case "$PATH" in
              database/migrations/*)
                MIGRATIONS=true
                ;;
            esac

            case "$PATH" in
              .github/*|tests/*|node_modules/*|vendor/*|storage/*|.env|.gitignore|frotapro-staging.zip)
                ;;
              *)
                DEPLOY=true
                ;;
            esac
          done < changed-files.txt

          echo "frontend=$FRONTEND" >> "$GITHUB_OUTPUT"
          echo "full_required=$FULL_REQUIRED" >> "$GITHUB_OUTPUT"
          echo "migrations=$MIGRATIONS" >> "$GITHUB_OUTPUT"
          echo "deploy=$DEPLOY" >> "$GITHUB_OUTPUT"

      - name: Bloquear alteracao de dependencias PHP
        if: steps.changes.outputs.full_required == 'true'
        shell: bash
        run: |
          echo "composer.json ou composer.lock foi alterado."
          echo "O deploy incremental foi interrompido para evitar vendor inconsistente."
          echo "Execute manualmente o workflow Deploy FrotaPro Staging para gerar o pacote completo."
          exit 1

      - name: Configurar Node
        if: steps.changes.outputs.frontend == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: Instalar dependencias frontend
        if: steps.changes.outputs.frontend == 'true'
        run: npm ci

      - name: Compilar frontend
        if: steps.changes.outputs.frontend == 'true'
        run: npm run build

      - name: Preparar arquivos incrementais
        if: steps.changes.outputs.deploy == 'true'
        shell: bash
        run: |
          set -euo pipefail

          rm -rf deploy-incremental
          rm -f deploy-delete.txt
          mkdir -p deploy-incremental
          touch deploy-delete.txt

          ignorar() {
            case "$1" in
              .github/*|tests/*|node_modules/*|vendor/*|storage/*|.env|.gitignore|frotapro-staging.zip|public/build/*)
                return 0
                ;;
              *)
                return 1
                ;;
            esac
          }

          adicionar() {
            SRC="$1"

            ignorar "$SRC" && return 0
            [ -f "$SRC" ] || return 0

            if [[ "$SRC" == public/* ]]; then
              REL="${SRC#public/}"

              mkdir -p "deploy-incremental/core/public/$(dirname "$REL")"
              cp -p "$SRC" "deploy-incremental/core/public/$REL"

              if [ "$REL" != "index.php" ] && [ "$REL" != ".htaccess" ]; then
                mkdir -p "deploy-incremental/$(dirname "$REL")"
                cp -p "$SRC" "deploy-incremental/$REL"
              fi
            else
              mkdir -p "deploy-incremental/core/$(dirname "$SRC")"
              cp -p "$SRC" "deploy-incremental/core/$SRC"
            fi
          }

          remover() {
            SRC="$1"

            ignorar "$SRC" && return 0

            if [[ "$SRC" == public/* ]]; then
              REL="${SRC#public/}"

              echo "core/public/$REL" >> deploy-delete.txt

              if [ "$REL" != "index.php" ] && [ "$REL" != ".htaccess" ]; then
                echo "$REL" >> deploy-delete.txt
              fi
            else
              echo "core/$SRC" >> deploy-delete.txt
            fi
          }

          while IFS=$'\t' read -r STATUS PATH1 PATH2; do
            [ -n "${STATUS:-}" ] || continue

            case "$STATUS" in
              A*|M*|T*)
                adicionar "$PATH1"
                ;;
              D*)
                remover "$PATH1"
                ;;
              R*)
                remover "$PATH1"
                adicionar "$PATH2"
                ;;
              C*)
                adicionar "$PATH2"
                ;;
            esac
          done < changed-files.txt

          echo ""
          echo "Arquivos preparados:"
          find deploy-incremental -type f -print | sort || true

          echo ""
          echo "Arquivos a remover:"
          cat deploy-delete.txt || true

      - name: Instalar lftp
        if: steps.changes.outputs.deploy == 'true' || steps.changes.outputs.frontend == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y lftp

      - name: Enviar alteracoes por FTPS
        if: steps.changes.outputs.deploy == 'true' || steps.changes.outputs.frontend == 'true'
        shell: bash
        env:
          FTP_SERVER: ${{ secrets.FROTAPRO_FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FROTAPRO_FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FROTAPRO_FTP_PASSWORD }}
          FRONTEND_CHANGED: ${{ steps.changes.outputs.frontend }}
          FILES_CHANGED: ${{ steps.changes.outputs.deploy }}
        run: |
          set -euo pipefail

          cat > deploy.lftp <<'EOF'
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ftp:passive-mode true
          set ssl:verify-certificate no
          set net:max-retries 10
          set net:timeout 60
          set net:reconnect-interval-base 5
          set net:reconnect-interval-max 30
          set xfer:clobber true
          EOF

          if [ "$FILES_CHANGED" = "true" ] && [ -d deploy-incremental ]; then
            while IFS= read -r LOCAL; do
              REMOTE="${LOCAL#deploy-incremental/}"
              DIR="$(dirname "$REMOTE")"

              ESC_LOCAL="${LOCAL//\\/\\\\}"
              ESC_LOCAL="${ESC_LOCAL//\"/\\\"}"

              ESC_REMOTE="${REMOTE//\\/\\\\}"
              ESC_REMOTE="${ESC_REMOTE//\"/\\\"}"

              ESC_DIR="${DIR//\\/\\\\}"
              ESC_DIR="${ESC_DIR//\"/\\\"}"

              printf 'mkdir -p "%s"\n' "$ESC_DIR" >> deploy.lftp
              printf 'put "%s" -o "%s"\n' "$ESC_LOCAL" "$ESC_REMOTE" >> deploy.lftp
            done < <(find deploy-incremental -type f -print | sort)
          fi

          if [ "$FRONTEND_CHANGED" = "true" ]; then
            echo 'mirror --reverse --delete --no-perms --parallel=2 --verbose=1 public/build/ build/' >> deploy.lftp
            echo 'mirror --reverse --delete --no-perms --parallel=2 --verbose=1 public/build/ core/public/build/' >> deploy.lftp
          fi

          if [ -s deploy-delete.txt ]; then
            while IFS= read -r REMOTE; do
              [ -n "$REMOTE" ] || continue

              ESCAPED="${REMOTE//\\/\\\\}"
              ESCAPED="${ESCAPED//\"/\\\"}"

              printf 'rm -f "%s"\n' "$ESCAPED" >> deploy.lftp
            done < deploy-delete.txt
          fi

          echo 'bye' >> deploy.lftp

          lftp -u "$FTP_USERNAME","$FTP_PASSWORD" "ftp://$FTP_SERVER:21" < deploy.lftp

      - name: Avisar sobre migrations
        if: steps.changes.outputs.migrations == 'true'
        run: |
          echo "::warning::Foram alteradas migrations. Os arquivos foram enviados, mas o banco de dados nao foi migrado automaticamente."

      - name: Resumo incremental
        run: |
          echo "=========================================="
          echo "FrotaPro Staging - deploy incremental"
          echo "Frontend recompilado: ${{ steps.changes.outputs.frontend }}"
          echo "Arquivos de aplicacao: ${{ steps.changes.outputs.deploy }}"
          echo "Migrations alteradas: ${{ steps.changes.outputs.migrations }}"
          echo ".env preservado"
          echo "storage preservado"
          echo "=========================================="

  full:
    name: Gerar pacote completo
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configurar PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: mbstring, pdo_mysql, bcmath, intl, gd, zip
          coverage: none

      - name: Configurar Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: Instalar dependencias PHP
        run: composer install --no-dev --prefer-dist --no-interaction --optimize-autoloader --no-progress

      - name: Instalar dependencias frontend
        run: npm ci

      - name: Compilar frontend
        run: npm run build

      - name: Montar pacote completo
        shell: bash
        run: |
          set -euo pipefail

          rm -rf deploy
          rm -f frotapro-staging.zip
          mkdir -p deploy/core

          rsync -a ./ deploy/core/ \
            --exclude='/deploy/' \
            --exclude='/.git/' \
            --exclude='/.github/' \
            --exclude='/node_modules/' \
            --exclude='/vendor/' \
            --exclude='/tests/' \
            --exclude='/.env' \
            --exclude='/storage/logs/*' \
            --exclude='/storage/framework/cache/*' \
            --exclude='/storage/framework/sessions/*' \
            --exclude='/storage/framework/views/*'

          mkdir -p deploy/core/vendor
          rsync -a vendor/ deploy/core/vendor/

          rsync -a public/ deploy/ \
            --exclude='index.php' \
            --exclude='.htaccess'

          cat > deploy/index.php <<'PHP'
          <?php

          use Illuminate\Foundation\Application;
          use Illuminate\Http\Request;

          define('LARAVEL_START',microtime(true));

          if(file_exists($maintenance=__DIR__.'/core/storage/framework/maintenance.php')){
              require $maintenance;
          }

          require __DIR__.'/core/vendor/autoload.php';

          /** @var Application $app */
          $app=require_once __DIR__.'/core/bootstrap/app.php';

          $app->handleRequest(Request::capture());
          PHP

          cat > deploy/.htaccess <<'HTACCESS'
          <IfModule mod_rewrite.c>
              <IfModule mod_negotiation.c>
                  Options -MultiViews -Indexes
              </IfModule>

              RewriteEngine On
              DirectoryIndex index.php

              RewriteRule ^core(?:/|$) - [F,L,NC]
              RewriteRule ^\. - [F,L,NC]

              RewriteCond %{HTTP:Authorization} .
              RewriteRule .* - [E=HTTP_AUTHORIZATION:%{HTTP:Authorization}]

              RewriteCond %{HTTP:x-xsrf-token} .
              RewriteRule .* - [E=HTTP_X_XSRF_TOKEN:%{HTTP:X-XSRF-Token}]

              RewriteCond %{REQUEST_FILENAME} !-d
              RewriteCond %{REQUEST_FILENAME} !-f
              RewriteRule ^ index.php [L]
          </IfModule>
          HTACCESS

          mkdir -p deploy/core/storage/logs
          mkdir -p deploy/core/storage/framework/cache/data
          mkdir -p deploy/core/storage/framework/sessions
          mkdir -p deploy/core/storage/framework/views
          mkdir -p deploy/core/bootstrap/cache

          touch deploy/core/storage/logs/deploy.keep
          touch deploy/core/storage/framework/cache/data/deploy.keep
          touch deploy/core/storage/framework/sessions/deploy.keep
          touch deploy/core/storage/framework/views/deploy.keep
          touch deploy/core/bootstrap/cache/deploy.keep

      - name: Normalizar permissoes
        shell: bash
        run: |
          set -euo pipefail

          find deploy -type d -exec chmod 755 {} \;
          find deploy -type f -exec chmod 644 {} \;

          find deploy/core/storage -type d -exec chmod 775 {} \;
          find deploy/core/storage -type f -exec chmod 664 {} \;

          find deploy/core/bootstrap/cache -type d -exec chmod 775 {} \;
          find deploy/core/bootstrap/cache -type f -exec chmod 664 {} \;

          chmod 644 deploy/index.php
          chmod 644 deploy/.htaccess

      - name: Validar pacote
        shell: bash
        run: |
          set -euo pipefail

          test -f deploy/index.php
          test -f deploy/.htaccess
          test -f deploy/core/artisan
          test -f deploy/core/bootstrap/app.php
          test -f deploy/core/composer.json
          test -f deploy/core/vendor/autoload.php
          test -f deploy/build/manifest.json
          test -f deploy/core/public/build/manifest.json

          if [ -f deploy/core/.env ]; then
            echo "ERRO: .env foi incluido no pacote."
            exit 1
          fi

          echo "Pacote completo validado."

      - name: Instalar ferramentas
        run: |
          sudo apt-get update
          sudo apt-get install -y zip lftp

      - name: Compactar projeto
        shell: bash
        run: |
          set -euo pipefail

          cd deploy
          zip -rq ../frotapro-staging.zip .
          cd ..

          ls -lh frotapro-staging.zip
          sha256sum frotapro-staging.zip

      - name: Enviar ZIP por FTPS
        shell: bash
        env:
          FTP_SERVER: ${{ secrets.FROTAPRO_FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FROTAPRO_FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FROTAPRO_FTP_PASSWORD }}
        run: |
          set -euo pipefail

          lftp -u "$FTP_USERNAME","$FTP_PASSWORD" "ftp://$FTP_SERVER:21" <<'EOF'
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ftp:passive-mode true
          set ssl:verify-certificate no
          set net:max-retries 10
          set net:timeout 60
          set net:reconnect-interval-base 5
          set net:reconnect-interval-max 30
          set xfer:clobber true

          put frotapro-staging.zip -o frotapro-staging.zip

          bye
          EOF

      - name: Resumo pacote completo
        run: |
          echo "=========================================="
          echo "Pacote completo enviado:"
          echo "frotapro-staging.zip"
          echo ""
          echo "Extrair pelo File Manager em:"
          echo "/public_html/sistemas/frotapro/"
          echo ""
          echo "O .env nao faz parte do ZIP."
          echo "=========================================="
