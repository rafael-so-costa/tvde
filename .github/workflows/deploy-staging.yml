name: Deploy FrotaPro Staging

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frotapro-staging
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy staging
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configurar PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: mbstring, pdo_mysql, bcmath, intl, gd, zip
          coverage: none

      - name: Configurar Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: Instalar dependencias PHP
        run: composer install --no-dev --prefer-dist --no-interaction --optimize-autoloader --no-progress

      - name: Instalar dependencias frontend
        run: npm ci

      - name: Compilar frontend
        run: npm run build

      - name: Montar pacote de deploy
        shell: bash
        run: |
          set -euo pipefail

          rm -rf deploy
          mkdir -p deploy/core

          rsync -a ./ deploy/core/ \
            --exclude='/deploy/' \
            --exclude='/.git/' \
            --exclude='/.github/' \
            --exclude='/node_modules/' \
            --exclude='/vendor/' \
            --exclude='/tests/' \
            --exclude='/.env'

          mkdir -p deploy/core/vendor
          rsync -a vendor/ deploy/core/vendor/

          rsync -a public/ deploy/ \
            --exclude='index.php' \
            --exclude='.htaccess'

          cat > deploy/index.php <<'PHP'
          <?php

          use Illuminate\Foundation\Application;
          use Illuminate\Http\Request;

          define('LARAVEL_START',microtime(true));

          if(file_exists($maintenance=__DIR__.'/core/storage/framework/maintenance.php')){
              require $maintenance;
          }

          require __DIR__.'/core/vendor/autoload.php';

          /** @var Application $app */
          $app=require_once __DIR__.'/core/bootstrap/app.php';

          $app->handleRequest(Request::capture());
          PHP

          cat > deploy/.htaccess <<'HTACCESS'
          <IfModule mod_rewrite.c>
              <IfModule mod_negotiation.c>
                  Options -MultiViews -Indexes
              </IfModule>

              RewriteEngine On
              DirectoryIndex index.php

              RewriteRule ^core(?:/|$) - [F,L,NC]
              RewriteRule ^\. - [F,L,NC]

              RewriteCond %{HTTP:Authorization} .
              RewriteRule .* - [E=HTTP_AUTHORIZATION:%{HTTP:Authorization}]

              RewriteCond %{HTTP:x-xsrf-token} .
              RewriteRule .* - [E=HTTP_X_XSRF_TOKEN:%{HTTP:X-XSRF-Token}]

              RewriteCond %{REQUEST_FILENAME} !-d
              RewriteCond %{REQUEST_FILENAME} !-f
              RewriteRule ^ index.php [L]
          </IfModule>
          HTACCESS

          mkdir -p deploy/core/storage/logs
          mkdir -p deploy/core/storage/framework/cache/data
          mkdir -p deploy/core/storage/framework/sessions
          mkdir -p deploy/core/storage/framework/views
          mkdir -p deploy/core/bootstrap/cache

          touch deploy/core/storage/logs/deploy.keep
          touch deploy/core/storage/framework/cache/data/deploy.keep
          touch deploy/core/storage/framework/sessions/deploy.keep
          touch deploy/core/storage/framework/views/deploy.keep
          touch deploy/core/bootstrap/cache/deploy.keep

      - name: Validar pacote de deploy
        shell: bash
        run: |
          set -euo pipefail

          echo "Validando raiz publica..."

          test -f deploy/index.php
          test -f deploy/.htaccess

          echo "Validando Laravel..."

          test -f deploy/core/artisan
          test -f deploy/core/bootstrap/app.php
          test -f deploy/core/composer.json
          test -f deploy/core/vendor/autoload.php

          echo "Validando frontend..."

          test -f deploy/build/manifest.json
          test -f deploy/core/public/build/manifest.json

          echo ""
          echo "Raiz publica:"
          find deploy \
            -maxdepth 1 \
            -mindepth 1 \
            -printf "%f\n" \
            | sort

          echo ""
          echo "Core:"
          find deploy/core \
            -maxdepth 1 \
            -mindepth 1 \
            -printf "%f\n" \
            | sort

          echo ""
          echo "Pacote validado com sucesso."

      - name: Enviar core base por FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FROTAPRO_FTP_SERVER }}
          username: ${{ secrets.FROTAPRO_FTP_USERNAME }}
          password: ${{ secrets.FROTAPRO_FTP_PASSWORD }}
          protocol: ftps
          port: 21
          local-dir: ./deploy/core/
          server-dir: ./core/
          dangerous-clean-slate: false
          security: loose
          timeout: 60000
          log-level: standard
          state-name: .ftp-deploy-core-base.json
          exclude: |
            **/.git
            **/.git/**
            **/.env
            app/**
            database/**
            public/**
            resources/**
            routes/**
            storage/**
            vendor/**
            tests/**
            node_modules/**

      - name: Enviar app por FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FROTAPRO_FTP_SERVER }}
          username: ${{ secrets.FROTAPRO_FTP_USERNAME }}
          password: ${{ secrets.FROTAPRO_FTP_PASSWORD }}
          protocol: ftps
          port: 21
          local-dir: ./deploy/core/app/
          server-dir: ./core/app/
          dangerous-clean-slate: false
          security: loose
          timeout: 60000
          log-level: standard
          state-name: .ftp-deploy-app.json

      - name: Enviar database por FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FROTAPRO_FTP_SERVER }}
          username: ${{ secrets.FROTAPRO_FTP_USERNAME }}
          password: ${{ secrets.FROTAPRO_FTP_PASSWORD }}
          protocol: ftps
          port: 21
          local-dir: ./deploy/core/database/
          server-dir: ./core/database/
          dangerous-clean-slate: false
          security: loose
          timeout: 60000
          log-level: standard
          state-name: .ftp-deploy-database.json

      - name: Enviar resources por FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FROTAPRO_FTP_SERVER }}
          username: ${{ secrets.FROTAPRO_FTP_USERNAME }}
          password: ${{ secrets.FROTAPRO_FTP_PASSWORD }}
          protocol: ftps
          port: 21
          local-dir: ./deploy/core/resources/
          server-dir: ./core/resources/
          dangerous-clean-slate: false
          security: loose
          timeout: 60000
          log-level: standard
          state-name: .ftp-deploy-resources.json

      - name: Enviar routes por FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FROTAPRO_FTP_SERVER }}
          username: ${{ secrets.FROTAPRO_FTP_USERNAME }}
          password: ${{ secrets.FROTAPRO_FTP_PASSWORD }}
          protocol: ftps
          port: 21
          local-dir: ./deploy/core/routes/
          server-dir: ./core/routes/
          dangerous-clean-slate: false
          security: loose
          timeout: 60000
          log-level: standard
          state-name: .ftp-deploy-routes.json

      - name: Enviar public interno por FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FROTAPRO_FTP_SERVER }}
          username: ${{ secrets.FROTAPRO_FTP_USERNAME }}
          password: ${{ secrets.FROTAPRO_FTP_PASSWORD }}
          protocol: ftps
          port: 21
          local-dir: ./deploy/core/public/
          server-dir: ./core/public/
          dangerous-clean-slate: false
          security: loose
          timeout: 60000
          log-level: standard
          state-name: .ftp-deploy-core-public.json

      - name: Enviar vendor por FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FROTAPRO_FTP_SERVER }}
          username: ${{ secrets.FROTAPRO_FTP_USERNAME }}
          password: ${{ secrets.FROTAPRO_FTP_PASSWORD }}
          protocol: ftps
          port: 21
          local-dir: ./deploy/core/vendor/
          server-dir: ./core/vendor/
          dangerous-clean-slate: false
          security: loose
          timeout: 60000
          log-level: standard
          state-name: .ftp-deploy-vendor.json

      - name: Enviar storage estrutural por FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FROTAPRO_FTP_SERVER }}
          username: ${{ secrets.FROTAPRO_FTP_USERNAME }}
          password: ${{ secrets.FROTAPRO_FTP_PASSWORD }}
          protocol: ftps
          port: 21
          local-dir: ./deploy/core/storage/
          server-dir: ./core/storage/
          dangerous-clean-slate: false
          security: loose
          timeout: 60000
          log-level: standard
          state-name: .ftp-deploy-storage.json

      - name: Enviar raiz publica por FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FROTAPRO_FTP_SERVER }}
          username: ${{ secrets.FROTAPRO_FTP_USERNAME }}
          password: ${{ secrets.FROTAPRO_FTP_PASSWORD }}
          protocol: ftps
          port: 21
          local-dir: ./deploy/
          server-dir: ./
          dangerous-clean-slate: false
          security: loose
          timeout: 60000
          log-level: standard
          state-name: .ftp-deploy-public.json
          exclude: |
            **/.git
            **/.git/**
            **/node_modules/**
            **/vendor/**
            **/.env
            core/**
