name: Deploy FrotaPro Staging

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frotapro-staging
  cancel-in-progress: true

jobs:
  deploy:
    name: Preparar e enviar staging
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configurar PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: mbstring, pdo_mysql, bcmath, intl, gd, zip
          coverage: none

      - name: Configurar Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: Instalar dependencias PHP
        run: composer install --no-dev --prefer-dist --no-interaction --optimize-autoloader --no-progress

      - name: Instalar dependencias frontend
        run: npm ci

      - name: Compilar frontend
        run: npm run build

      - name: Montar pacote de deploy
        shell: bash
        run: |
          set -euo pipefail

          rm -rf deploy
          rm -f frotapro-staging.zip

          mkdir -p deploy/core

          rsync -a ./ deploy/core/ \
            --exclude='/deploy/' \
            --exclude='/.git/' \
            --exclude='/.github/' \
            --exclude='/node_modules/' \
            --exclude='/vendor/' \
            --exclude='/tests/' \
            --exclude='/.env'

          mkdir -p deploy/core/vendor
          rsync -a vendor/ deploy/core/vendor/

          rsync -a public/ deploy/ \
            --exclude='index.php' \
            --exclude='.htaccess'

          cat > deploy/index.php <<'PHP'
          <?php

          use Illuminate\Foundation\Application;
          use Illuminate\Http\Request;

          define('LARAVEL_START',microtime(true));

          if(file_exists($maintenance=__DIR__.'/core/storage/framework/maintenance.php')){
              require $maintenance;
          }

          require __DIR__.'/core/vendor/autoload.php';

          /** @var Application $app */
          $app=require_once __DIR__.'/core/bootstrap/app.php';

          $app->handleRequest(Request::capture());
          PHP

          cat > deploy/.htaccess <<'HTACCESS'
          <IfModule mod_rewrite.c>
              <IfModule mod_negotiation.c>
                  Options -MultiViews -Indexes
              </IfModule>

              RewriteEngine On
              DirectoryIndex index.php

              RewriteRule ^core(?:/|$) - [F,L,NC]
              RewriteRule ^\. - [F,L,NC]

              RewriteCond %{HTTP:Authorization} .
              RewriteRule .* - [E=HTTP_AUTHORIZATION:%{HTTP:Authorization}]

              RewriteCond %{HTTP:x-xsrf-token} .
              RewriteRule .* - [E=HTTP_X_XSRF_TOKEN:%{HTTP:X-XSRF-Token}]

              RewriteCond %{REQUEST_FILENAME} !-d
              RewriteCond %{REQUEST_FILENAME} !-f
              RewriteRule ^ index.php [L]
          </IfModule>
          HTACCESS

          mkdir -p deploy/core/storage/logs
          mkdir -p deploy/core/storage/framework/cache/data
          mkdir -p deploy/core/storage/framework/sessions
          mkdir -p deploy/core/storage/framework/views
          mkdir -p deploy/core/bootstrap/cache

          touch deploy/core/storage/logs/deploy.keep
          touch deploy/core/storage/framework/cache/data/deploy.keep
          touch deploy/core/storage/framework/sessions/deploy.keep
          touch deploy/core/storage/framework/views/deploy.keep
          touch deploy/core/bootstrap/cache/deploy.keep

      - name: Normalizar permissoes do pacote
        shell: bash
        run: |
          set -euo pipefail

          echo "Aplicando permissoes padrao..."

          find deploy -type d -exec chmod 755 {} \;
          find deploy -type f -exec chmod 644 {} \;

          chmod -R 775 deploy/core/storage
          chmod -R 775 deploy/core/bootstrap/cache

          chmod 644 deploy/index.php
          chmod 644 deploy/.htaccess

          echo ""
          echo "Permissoes principais:"
          stat -c "%a %n" deploy/index.php
          stat -c "%a %n" deploy/.htaccess
          stat -c "%a %n" deploy/core
          stat -c "%a %n" deploy/core/vendor
          stat -c "%a %n" deploy/core/storage
          stat -c "%a %n" deploy/core/bootstrap/cache

          echo ""
          echo "Amostra de arquivos do vendor:"
          find deploy/core/vendor -type f | sed -n '1,5p' | while IFS= read -r file; do
            stat -c "%a %n" "$file"
          done

      - name: Validar pacote
        shell: bash
        run: |
          set -euo pipefail

          test -f deploy/index.php
          test -f deploy/.htaccess

          test -f deploy/core/artisan
          test -f deploy/core/bootstrap/app.php
          test -f deploy/core/composer.json
          test -f deploy/core/vendor/autoload.php

          test -f deploy/build/manifest.json
          test -f deploy/core/public/build/manifest.json

          if [ -f deploy/core/.env ]; then
            echo "ERRO: .env foi incluido no pacote."
            exit 1
          fi

          if find deploy/core/vendor -type f ! -perm 0644 -print -quit | grep -q .; then
            echo "ERRO: Existem arquivos no vendor com permissao diferente de 644."
            find deploy/core/vendor -type f ! -perm 0644 | head -20
            exit 1
          fi

          if find deploy/core/vendor -type d ! -perm 0755 -print -quit | grep -q .; then
            echo "ERRO: Existem diretorios no vendor com permissao diferente de 755."
            find deploy/core/vendor -type d ! -perm 0755 | head -20
            exit 1
          fi

          echo "Pacote validado com sucesso."

      - name: Instalar ferramentas de deploy
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y zip lftp

      - name: Compactar projeto
        shell: bash
        run: |
          set -euo pipefail

          cd deploy
          zip -rq ../frotapro-staging.zip .
          cd ..

          test -f frotapro-staging.zip

          echo ""
          echo "Arquivo gerado:"
          ls -lh frotapro-staging.zip

          echo ""
          echo "SHA256:"
          sha256sum frotapro-staging.zip

          echo ""
          echo "Estrutura principal do ZIP:"
          unzip -l frotapro-staging.zip | head -80

      - name: Enviar ZIP por FTPS
        shell: bash
        env:
          FTP_SERVER: ${{ secrets.FROTAPRO_FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FROTAPRO_FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FROTAPRO_FTP_PASSWORD }}
        run: |
          set -euo pipefail

          lftp -u "$FTP_USERNAME","$FTP_PASSWORD" "ftp://$FTP_SERVER:21" <<'EOF'
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ftp:passive-mode true

          set ssl:verify-certificate no

          set net:max-retries 10
          set net:timeout 60
          set net:reconnect-interval-base 5
          set net:reconnect-interval-max 30

          set xfer:clobber true

          pwd

          put frotapro-staging.zip -o frotapro-staging.zip

          bye
          EOF

      - name: Deploy preparado
        shell: bash
        run: |
          echo "=========================================="
          echo "FrotaPro Staging preparado com sucesso."
          echo ""
          echo "Arquivo enviado:"
          echo "frotapro-staging.zip"
          echo ""
          echo "Permissoes do pacote:"
          echo "Diretorios normais: 755"
          echo "Arquivos normais: 644"
          echo "storage: 775"
          echo "bootstrap/cache: 775"
          echo ""
          echo "Proximo passo:"
          echo "1. Abrir o File Manager do cPanel"
          echo "2. Localizar frotapro-staging.zip"
          echo "3. Extrair diretamente na raiz do staging"
          echo "4. Nao extrair dentro da pasta core"
          echo "=========================================="
